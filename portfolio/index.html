<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeiad Mohammed — Mobile & Systems Portfolio</title>
  </head>
  <body class="bg-[#0a0a0c] text-neutral-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">
    <!-- BOC Elastic Splash Band Mount -->
    <header id="band-container" class="sticky top-0 z-40 w-full h-16 border-b border-white/10 backdrop-blur-md bg-black/40 flex items-center px-6">
      <div class="flex items-center justify-between w-full">
        <span class="font-bold tracking-wider text-sm uppercase">Zeiad Mohammed</span>
        <canvas id="marquee-canvas" class="hidden"></canvas>
        <span class="text-xs text-neutral-400 font-mono">Mobile / KMP / Systems</span>
      </div>
    </header>

    <!-- Main View Mount (Artemii 3D WebGL Carousel) -->
    <main id="app" class="relative flex-1 flex flex-col items-center justify-center min-h-[calc(100vh-4rem)] p-6">
      <div id="carousel-container" class="absolute inset-0 z-10 w-full h-full pointer-events-auto"></div>

      <!-- Hero Overlay Content -->
      <div class="relative z-20 pointer-events-none text-center max-w-2xl px-4">
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">
          Engineered for Motion & Scale.
        </h1>
        <p class="text-neutral-400 text-sm md:text-base leading-relaxed mb-6">
          Native Android, Kotlin Multiplatform, and reactive full-stack solutions.
        </p>
        <div id="project-counter" class="text-xs font-mono text-neutral-500">
          <!-- Populated by main.ts -->
        </div>
      </div>
    </main>

    <!-- Core-A Glare Wipe Overlay Mount -->
    <div
      id="glare-overlay"
      class="fixed inset-0 pointer-events-none z-50 bg-white opacity-0 transition-opacity duration-300"
      aria-hidden="true"
    ></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
